<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HRIS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-wrapper">

<div class="card login-card">
    <div class="login-logo"><h1 style="margin:0; color:#2c3e50;">HRIS</h1></div>
    <h2 style="text-align: center; color: #2c3e50; margin-bottom:8px;">Login ke HRIS</h2>
    <p id="error-msg" class="error-msg"></p>

    <form id="login-form">
        <div class="form-row">
            <label for="username" style="display: block; margin-bottom: 6px; font-weight: 600;">Username</label>
            <input type="text" id="username" required>
        </div>
        <div class="form-row">
            <label for="password" style="display: block; margin-bottom: 6px; font-weight: 600;">Password</label>
            <input type="password" id="password" required>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <label style="font-size:14px; color:#7f8c8d;"><input type="checkbox" id="remember"> Ingat saya</label>
            <a href="#" class="small-link">Lupa password?</a>
        </div>
        <button type="submit" class="btn-primary" style="width:100%; padding:12px; font-size:16px; margin-top:18px;">Masuk</button>
    </form>
</div>

<!-- Panggil logika login -->
<script src="login.js"></script>
</body>
</html>
