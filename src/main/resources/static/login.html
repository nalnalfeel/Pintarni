<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRIS Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Guard untuk cek login -->
<script src="auth-guard.js"></script>

<div class="app-container">
    <!-- SIDEBAR KIRI -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>🚀 HRIS</h2>
        </div>
        <nav class="sidebar-menu">
            <ul>
                <li><a href="#/dashboard" class="nav-link active" data-page="dashboard">🏠 Dashboard</a></li>
                <li><a href="#/employees" class="nav-link" data-page="employees">👥 Data Karyawan</a></li>
                <li><a href="#/leave" class="nav-link" data-page="leave">🏖️ Manajemen Cuti</a></li>
                <li><a href="#/attendance" class="nav-link" data-page="attendance">⏰ Absensi</a></li>
            </ul>
        </nav>
    </aside>

    <!-- AREA KONTEN KANAN -->
    <div class="main-content">
        <!-- TOP NAVBAR -->
        <header class="top-navbar">
            <h3 id="page-title">Dashboard</h3>
            <div class="user-info">
                <span id="user-name">User</span>
                <button class="logout-btn" id="logout-btn">Logout</button>
            </div>
        </header>

        <!-- KONTEN HALAMAN AKAN DI-LOAD DI SINI -->
        <main id="app-content" class="content-area">
            <div class="loading">Memuat...</div>
        </main>
    </div>
</div>

<!-- Core JS Router -->
<script src="app.js"></script>
</body>
</html>
