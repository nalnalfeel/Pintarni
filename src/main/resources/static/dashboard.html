<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Utama - HRIS</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: #f4f7f6; }
        .navbar { background-color: #0056b3; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .navbar h1 { margin: 0; font-size: 20px; font-weight: 500; }
        .logout-btn { background-color: #dc3545; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .logout-btn:hover { background-color: #b02a37; }
        .container { padding: 40px; max-width: 1000px; margin: 0 auto; }
        .welcome-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .badge { display: inline-block; background-color: #eef2f5; color: #0056b3; padding: 5px 10px; border-radius: 20px; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>
<!-- Guard ini akan jalan pertama kali untuk cek status login -->
<script src="auth-guard.js"></script>

<div class="navbar">
    <h1>🚀 Sistem Informasi HRD</h1>
    <button class="logout-btn" id="logout-btn">Logout</button>
</div>

<div class="container">
    <div class="welcome-card">
        <h2>Selamat Datang, <span id="user-name"></span>!</h2>
        <p>Anda masuk ke sistem sebagai: <span class="badge" id="user-role"></span></p>
        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">
        <p>Ini adalah halaman dashboard utama HRIS Anda. Modul Karyawan, Absensi, dan Cuti akan segera ditambahkan di sini.</p>
    </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
